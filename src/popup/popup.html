<!DOCTYPE html>
<html style="width: 280px; min-height: 300px;">
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 280px;
      min-height: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      padding: 16px;
      background: #1a1a1a;
      color: #e0e0e0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #444;
      border-radius: 12px;
      transition: 0.2s;
    }

    .toggle-slider:before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }

    .toggle input:checked + .toggle-slider {
      background: #4CAF50;
    }

    .toggle input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }

    .section {
      margin-bottom: 16px;
    }

    .label {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
      display: block;
    }

    select {
      width: 100%;
      padding: 8px 12px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 14px;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: #666;
    }

    .difficulty {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .difficulty-label {
      font-size: 16px;
      min-width: 24px;
      text-align: center;
    }

    input[type="range"] {
      flex: 1;
      height: 6px;
      background: #333;
      border-radius: 3px;
      appearance: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      background: #4CAF50;
      border-radius: 50%;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: #4CAF50;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }

    .difficulty-desc {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 4px;
    }

    .site-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
    }

    .site-toggle input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .site-domain {
      font-size: 12px;
      color: #aaa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .footer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
      text-align: center;
    }

    .settings-link {
      color: #888;
      font-size: 12px;
      text-decoration: none;
    }

    .settings-link:hover {
      color: #aaa;
    }

    .no-key-warning {
      background: #3a2a00;
      border: 1px solid #665500;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #ffcc00;
    }

    .no-key-warning a {
      color: #ffcc00;
    }
  </style>
</head>
<body>
  <p style="color: red;" id="error-display"></p>
  <div class="header">
    <span class="title">eli-lang</span>
    <label class="toggle">
      <input type="checkbox" id="enabled">
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div id="no-key-warning" class="no-key-warning" style="display: none;">
    No API key configured. <a href="#" id="open-settings">Set up in settings</a>
  </div>

  <div class="section">
    <label class="label">Learning</label>
    <select id="target-lang"></select>
  </div>

  <div class="section">
    <label class="label">Difficulty</label>
    <div class="difficulty">
      <span class="difficulty-label">🐷</span>
      <input type="range" id="difficulty" min="0" max="1" step="0.1">
      <span class="difficulty-label">📚</span>
    </div>
    <div class="difficulty-desc" id="difficulty-desc">Beginner friendly</div>
  </div>

  <div class="section">
    <div class="site-toggle">
      <input type="checkbox" id="site-enabled">
      <span>Enable on <span class="site-domain" id="site-domain">this site</span></span>
    </div>
  </div>

  <div class="footer">
    <a href="#" class="settings-link" id="open-settings-footer">Settings</a>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      document.getElementById('error-display').textContent = msg + ' at line ' + line;
    };
  </script>
  <script src="popup.js"></script>
</body>
</html>
