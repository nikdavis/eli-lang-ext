<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>eli-lang Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      background: #121212;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 32px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section {
      margin-bottom: 20px;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }

    select, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 14px;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #666;
    }

    .api-key-input {
      display: flex;
      gap: 8px;
    }

    .api-key-input input {
      flex: 1;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #4CAF50;
      color: white;
    }

    .btn-primary:hover {
      background: #45a049;
    }

    .btn-secondary {
      background: #333;
      color: #e0e0e0;
    }

    .btn-secondary:hover {
      background: #444;
    }

    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }

    .help-text a {
      color: #4CAF50;
    }

    .status {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 12px;
    }

    .status-success {
      background: #1a3a1a;
      color: #4CAF50;
    }

    .status-error {
      background: #3a1a1a;
      color: #ff5555;
    }

    .provider-select {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .provider-btn {
      flex: 1;
      padding: 12px;
      background: #2a2a2a;
      border: 2px solid #444;
      border-radius: 8px;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .provider-btn:hover {
      border-color: #666;
    }

    .provider-btn.active {
      border-color: #4CAF50;
      color: #e0e0e0;
      background: #1a2a1a;
    }

    .provider-btn.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>eli-lang</h1>
    <p class="subtitle">Language learning through immersion</p>

    <div class="card">
      <div class="card-title">LLM Provider</div>

      <div class="provider-select">
        <button class="provider-btn active" data-provider="fireworks">
          Fireworks
        </button>
        <button class="provider-btn disabled" data-provider="openai" title="Coming soon">
          OpenAI
        </button>
        <button class="provider-btn disabled" data-provider="google" title="Coming soon">
          Google AI
        </button>
      </div>

      <div class="section">
        <label for="api-key">API Key</label>
        <div class="api-key-input">
          <input type="password" id="api-key" placeholder="fw_...">
          <button class="btn btn-primary" id="save-key">Save</button>
        </div>
        <p class="help-text">
          Get your API key from <a href="https://fireworks.ai/api-keys" target="_blank" id="api-docs-link">fireworks.ai</a>
        </p>
        <div id="key-status"></div>
      </div>

      <div class="section">
        <label for="model">Model</label>
        <div class="api-key-input">
          <select id="model" style="flex: 1;">
            <option value="accounts/fireworks/models/qwen3-8b">Qwen3 8B</option>
          </select>
          <button class="btn btn-secondary" id="test-model">Test</button>
        </div>
        <div id="test-status"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Language Settings</div>

      <div class="section">
        <label for="native-lang">Your Native Language</label>
        <select id="native-lang"></select>
      </div>

      <div class="section">
        <label for="target-lang">Language You're Learning</label>
        <select id="target-lang"></select>
      </div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
